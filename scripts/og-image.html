<!doctype html>
<!--
  Source for public/og-image.png (1200x630 social card).
  Regenerate after editing:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
      --disable-gpu --hide-scrollbars --window-size=1200,630 \
      --virtual-time-budget=10000 \
      --screenshot=public/og-image.png scripts/og-image.html

  Social crawlers do not render SVG, so the committed PNG is what ships.
  Colours and type follow the site's design tokens (src/app/globals.css).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=JetBrains+Mono:wght@400;500&display=block"
    />
    <style>
      :root {
        --bg: #f6f3ee;
        --ink: #1c1a16;
        --acc: oklch(0.47 0.14 28);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        padding: 88px 96px 72px;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Newsreader', Georgia, serif;
        -webkit-font-smoothing: antialiased;
      }

      .eyebrow,
      .footer {
        font-family: 'JetBrains Mono', monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .eyebrow {
        font-size: 22px;
        color: var(--acc);
      }

      h1 {
        margin-top: 36px;
        font-size: 132px;
        font-weight: 400;
        line-height: 0.95;
        letter-spacing: -0.028em;
      }

      p {
        margin-top: 36px;
        font-size: 38px;
        font-weight: 300;
        line-height: 1.3;
      }

      .footer {
        margin-top: auto;
        border-top: 1.5px solid var(--ink);
        padding-top: 20px;
        font-size: 20px;
      }
    </style>
  </head>

  <body>
    <div class="eyebrow">Applied AI · Machine learning</div>
    <h1>Baptiste Audugé</h1>
    <p>Engineering student at CentraleSupélec (Université Paris-Saclay)</p>
    <div class="footer">auduge.com</div>
  </body>
</html>
